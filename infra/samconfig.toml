version = 0.1

# Deploy config for the `classyear-nest` stack.
#
# Every name here is deliberately distinct from `classyear-serverless`,
# including `s3_prefix` — cosmetic, but §8.5 asks for it so the two stacks'
# build artifacts stay separable in the SAM bucket.
#
# JWTSecret is *not* here. It is NoEcho in the template and belongs on the
# command line or in the environment, never in a committed file.

[default.deploy.parameters]
stack_name = "classyear-nest"
region = "us-east-1"
s3_prefix = "classyear-nest"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
# false, deliberately. This was `true`, and a `--dry-run` still executed its
# changeset — an interactive prompt against a non-TTY stdin is not a safety
# control. The control is now explicit flags in scripts/deploy.sh.
confirm_changeset = false

# Stack parameters are NOT here. `sam deploy --parameter-overrides` *replaces*
# this list rather than merging with it, and JWTSecret has to come from the
# command line because it is NoEcho and must never be committed — so keeping
# half the parameters here would guarantee the other half got dropped.
# scripts/deploy.sh owns the whole list.

[default.build.parameters]
# Nothing to build: scripts/bundle-lambda.sh produces infra/build/ and the
# template points straight at it. `sam build` would try to npm-install per
# function, which cannot work in a workspaces monorepo where node_modules is
# hoisted to the repo root.
skip_pull_image = true

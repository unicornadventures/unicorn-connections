AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClassYear (NestJS) - one proxy function + email worker

# =============================================================================
# This is the ~51k-line template of the source app, rebuilt.
#
# The old one defines 59 individually-declared Lambda functions wired to 68 API
# Gateway route events; adding an endpoint means editing YAML in three places.
# Here there is **one** ApiFunction behind `{proxy+}/ANY`, and Nest's router
# does the rest — so the route surface lives entirely in the application code
# the contract tests already cover.
#
# Deliberately NOT here:
#   * `BinarySettings` / `binaryMimeTypes`. These were expected to be needed for
#     multipart uploads. Phase 4 established there is no multipart: every
#     photo upload is a presigned PUT the browser performs directly against S3,
#     and the API never receives file bytes.
#   * Per-route OPTIONS functions. The source declared eight by hand; Nest's
#     CORS middleware (in `configureApp`, so the Lambda inherits it) handles
#     preflight for every route uniformly.
#
# Naming is kept distinct from `classyear-serverless` throughout, because both
# stacks live in one account and several of its names are account-scoped —
# the collision table. `Environment` defaults to `nest` for exactly this
# reason: `classyear-file-storage-${AccountId}-dev` already exists.
# =============================================================================

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: production
        DB_HOST: !Ref DatabaseHost
        DB_PORT: '5432'
        DB_NAME: !Ref DatabaseName
        DB_USER: classyear_admin
        DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
        # A boot never alters the schema. Changes are applied deliberately with
        # apps/api/src/cli/init-schema.ts, not as a side effect of a cold start
        # — and SchemaService rethrows on failure, so a migration racing a boot
        # would take the function down. This was first set because the Express
        # app ran its own initialization against the same database; that app
        # is gone, but a schema change is still a decision, not a deploy.
        RUN_MIGRATIONS: 'false'
        JWT_SECRET: !Ref JWTSecret
        ADMIN_SEED_PASSWORD_PARAM: !Ref AdminSeedPasswordParam
        # The canonical origin — but only while this stack serves it. With
        # ClaimPublicNames=false (a rollback) the app answers only at the
        # staging name, and a FRONTEND_URL naming the canonical domain would
        # put a host that no longer reaches it in password-reset links.
        FRONTEND_URL: !If
          - PublicNamesClaimed
          - !Sub 'https://${DomainName}'
          - !Sub 'https://${StagingDomainName}'
        # The other names. `origin` as a single string permits exactly one
        # origin, and every deployed API call is cross-origin, so without this
        # the www name and the staging name fail every request in the browser.
        CORS_ORIGINS: !Sub 'https://www.${DomainName},https://${StagingDomainName}'
        SES_FROM_EMAIL: !Sub 'noreply@${SesSenderDomain}'
        S3_BUCKET_NAME: !Ref FileBucketName
        FEEDBACK_ENABLED: !Ref FeedbackEnabled
        PASSWORD_RESET_QUEUE_URL: !Ref PasswordResetEmailQueue

Parameters:
  Environment:
    Type: String
    Default: nest
    Description: >-
      Suffix for account-scoped resource names. Must NOT be 'dev' or 'prod'
      while classyear-serverless exists: that stack's file bucket embeds the
      account id and its own Environment value, so a matching one here would
      fail on "bucket already exists".

  JWTSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret. No fallback exists; the app refuses to boot without it.

  AdminSeedPasswordParam:
    Type: String
    Default: '/classyear/nest/admin-seed-password'
    Description: >-
      SSM SecureString holding the admin seed password. Seeding is skipped if the
      parameter does not exist. Never put the password in this template.

  DomainName:
    Type: String
    Default: unicornconnections.org
    Description: >-
      The canonical name, and since reunion-connect.org was retired on
      2026-11-01 the only public domain. It is the origin FRONTEND_URL names
      and the identity SES sends as; www and the staging name reach the API
      through CORS_ORIGINS.

  HostedZoneId:
    Type: String
    Default: Z04780762C3Q0K0DKRGSP
    Description: Route53 zone for the domain, the www name and the staging name

  StagingDomainName:
    Type: String
    Default: nest.unicornconnections.org
    Description: >-
      A name of the app's own, on the certificate and the distribution
      whatever ClaimPublicNames says, so a deploy can be checked without going
      through the public names — and so a ClaimPublicNames=false rollback
      still leaves the app reachable somewhere. It was nest.reunion-connect.org
      until that domain was retired.

  ClaimPublicNames:
    Type: String
    Default: 'true'
    AllowedValues: ['false', 'true']
    Description: >-
      Whether this distribution claims the public names (the domain and www)
      and their DNS records. 'true' since the cutover, because this
      distribution is what serves them — the parameter creates those records,
      so a deploy that defaulted to 'false' would remove them and take the
      site down.
      It defaulted to 'false' while the old stack still held the aliases, since
      a CloudFront alias belongs to one distribution account-wide and claiming
      them early fails the deploy. Setting 'false' now is a deliberate
      rollback, not a safe default.

  SesSenderDomain:
    Type: String
    Default: unicornconnections.org
    Description: >-
      Verified SES identity to send as. Verified 2026-09-05, which is what
      unblocked making it the canonical domain. Kept separate from DomainName
      because the two answer different questions — where the app is served
      versus which identity SES will accept.

  FeedbackEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "'false' makes every /api/feedback route return 404"

  VPC:
    Type: AWS::EC2::VPC::Id
  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
  DatabaseHost:
    Type: String
    Default: classyear-dev.cluster-cezswsoi8m3o.us-east-1.rds.amazonaws.com
    Description: >-
      Writer endpoint of the EXISTING Aurora cluster, owned by
      classyear-serverless. It holds all of this app's data — the Express app
      that used it first is gone — and this stack references it rather than
      owning it, so no deploy here can replace or delete it.

  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN for that cluster's master credentials

  DatabaseName:
    Type: String
    Default: class_reunion

  FileBucketName:
    Type: String
    Default: classyear-file-storage-372666940943-dev
    Description: >-
      The EXISTING photo bucket, owned by classyear-serverless. Photo keys live
      in the database, so a bucket of this stack's own would hold none of the
      objects those rows name and every photo would 404. Its CORS rules live in
      classyear-serverless's template and must list every origin this app is
      served from, or presigned uploads fail their preflight.

  # The default VPC's Amazon-provided IPv6 range, attached directly on
  # 2026-11-13, is 2600:1f10:477b:7f00::/56; the private subnets take its
  # first two /64s. Given as values rather than carved with Fn::Cidr, which
  # CloudFormation accepts for IPv6 but cfn-lint (run by deploy.sh) rejects.
  PrivateSubnet1Ipv6Cidr:
    Type: String
    Default: 2600:1f10:477b:7f00::/64
  PrivateSubnet2Ipv6Cidr:
    Type: String
    Default: 2600:1f10:477b:7f01::/64

  PrivateRouteTableId:
    Type: String
    Default: rtb-06b3ba09c86210f60
    Description: >-
      The route table of the private subnets, which this stack adds the
      outbound IPv6 route to. It belongs to the default VPC, not to a stack.

  LambdaSecurityGroupId:
    Type: String
    Default: sg-02fa56b60b644cc22
    Description: >-
      The Lambda security group owned by classyear-serverless, reused rather
      than recreated. The cluster's security group admits 5432 from this group
      only, so joining it is what lets these functions reach the database
      without editing the other stack's resources.

  EnableBastion:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >-
      Whether to run the Session Manager bastion that scripts/backup-db.sh
      tunnels through to reach the database. scripts/deploy.sh passes 'true';
      this default only matters to a deploy that bypasses it.

  PublicSubnet:
    Type: String
    Default: subnet-09e87317804aade0b
    Description: >-
      Public-Subnet-1, for the bastion. Public so it reaches the Session
      Manager services over the internet gateway — the VPC has no NAT and no
      Session Manager endpoints.

  BastionImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >-
      Resolved on every deploy, so a deploy after a new AMI is published
      replaces the bastion with a patched one. It holds no state, so that is
      the patching strategy rather than a hazard.

Conditions:
  # Gates the four public aliases and their DNS records. See the parameter.
  PublicNamesClaimed: !Equals [!Ref ClaimPublicNames, 'true']
  BastionEnabled: !Equals [!Ref EnableBastion, 'true']

Resources:

  # ---------------------------------------------------------------------------
  # The API: one function, one catch-all route
  # ---------------------------------------------------------------------------

  ClassYearNestAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      TracingEnabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    # Ipv6AllowedForDualStack is refused unless every subnet already has an
    # IPv6 range, and the attachment cannot be inferred from a !Ref.
    DependsOn: [PrivateSubnet1Ipv6, PrivateSubnet2Ipv6]
    Properties:
      FunctionName: !Sub 'classyear-nest-api-${Environment}'
      # Pre-bundled by scripts/bundle-lambda.sh. This is an npm-workspaces
      # monorepo — apps/api/node_modules does not exist and shared-types is a
      # symlink with a runtime import — so a directory upload would ship a
      # function that resolves nothing.
      CodeUri: build/api/
      Handler: index.handler
      VpcConfig:
        # The second group only adds outbound IPv6: the shared Lambda group
        # belongs to classyear-serverless and allows outbound IPv4 alone.
        SecurityGroupIds: [!Ref LambdaSecurityGroupId, !Ref ApiIpv6EgressSecurityGroup]
        SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        # The function's only way out of the VPC. See "Outbound IPv6" below.
        Ipv6AllowedForDualStack: true
      Events:
        # Every route the app serves, including /pulse at the root. Nest's
        # global prefix puts everything else under /api.
        ProxyRoot:
          Type: Api
          Properties:
            RestApiId: !Ref ClassYearNestAPI
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref ClassYearNestAPI
            Path: /{proxy+}
            Method: ANY
      Policies:
        - !Ref LambdaSecretsManagerPolicy
        - !Ref LambdaSESPolicy
        - S3CrudPolicy:
            BucketName: !Ref FileBucketName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PasswordResetEmailQueue.QueueName

  # ---------------------------------------------------------------------------
  # Password-reset email worker — the queue is kept deliberately
  # ---------------------------------------------------------------------------

  PasswordResetEmailDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'classyear-nest-password-reset-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days

  PasswordResetEmailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'classyear-nest-password-reset-${Environment}'
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PasswordResetEmailDLQ.Arn
        maxReceiveCount: 3

  EmailWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'classyear-nest-email-worker-${Environment}'
      CodeUri: build/workers/
      Handler: index.sendPasswordResetEmailHandler
      Timeout: 30
      # Deliberately outside the VPC: SES has no VPC endpoint in this account,
      # so an in-VPC worker could not reach it. That is the reason this is a
      # separate function rather than another route on the proxy.
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt PasswordResetEmailQueue.Arn
            BatchSize: 5
      Policies:
        - !Ref LambdaSESPolicy
        - SQSPollerPolicy:
            QueueName: !GetAtt PasswordResetEmailQueue.QueueName

  # ---------------------------------------------------------------------------
  # Shared IAM
  # ---------------------------------------------------------------------------

  LambdaSecretsManagerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: RDS credentials, the admin seed parameter, and VPC ENI management
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DatabaseSecretArn
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/classyear/*'
          # SAM does not always attach AWSLambdaVPCAccessExecutionRole when
          # VpcConfig is set this way, and without ENI rights the function
          # cannot start inside the VPC at all.
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:DescribeSubnets
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'

  LambdaSESPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Send transactional email via SES
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource: '*'

  # ---------------------------------------------------------------------------
  # Storage — owned by classyear-serverless, not created here
  # ---------------------------------------------------------------------------
  #
  # There is no FileBucket resource for the same reason there is no RDSCluster:
  # the photo keys live in the database, so they only resolve against the
  # bucket they were written to. This stack had its own
  # `classyear-nest-files-...` bucket during the migration, and the effect was
  # that every photo 404'd — the keys in the `profiles` and `gallery_photos`
  # rows named objects in the *other* bucket, and this app signed valid URLs
  # against an empty one.
  #
  # `FileBucketName` therefore points at the existing bucket. The consequence
  # worth knowing: its CORS rules belong to classyear-serverless's template, so
  # an origin this app is served from has to be added *there* — a presigned
  # PUT is a browser request straight to S3, and the bucket is what answers
  # the preflight. Serving a new name without that change breaks uploads while
  # leaving display working. infra/README.md says how to change that stack.

  # ---------------------------------------------------------------------------
  # Database — owned by classyear-serverless, not created here
  # ---------------------------------------------------------------------------
  #
  # This app took over the Express app's cluster rather than migrating to a new
  # one: a snapshot-restore would have lost every write between the snapshot
  # and the switch. The Express app is gone and this is now the only app using
  # it, but the cluster stays in the other stack, so no deploy here can replace
  # or delete it. There is no RDSCluster, RDSWriterInstance, DBSubnetGroup or
  # DBSecurityGroup here — DatabaseHost and DatabaseSecretArn point at it.
  #
  # The schema is changed only on purpose: RUN_MIGRATIONS=false above, and
  # apps/api/src/cli/init-schema.ts to apply changes.
  #
  # There is also no LambdaSecurityGroup: these functions join the other
  # stack's group (LambdaSecurityGroupId), which is what the cluster already
  # admits, so nothing in that stack has to change.

  # ---------------------------------------------------------------------------
  # Outbound IPv6, instead of interface endpoints
  # ---------------------------------------------------------------------------
  #
  # The API function lives in the private subnets to reach the database, and
  # the VPC has no NAT. It still has to call Secrets Manager (the database
  # password, at cold start) and SQS (password-reset emails). Interface
  # endpoints did that, at $0.01 per endpoint per AZ-hour — about $29 a month
  # for two endpoints, nearly the whole bill of a site this size.
  #
  # An egress-only internet gateway is free and gives outbound-only IPv6, and
  # both services answer on IPv6: Secrets Manager on its normal hostname, SQS
  # on its dual-stack one (sqs.<region>.api.aws), which the dispatcher asks for.
  # The function runs Node 22, whose connect tries IPv4 and IPv6 together, so
  # an IPv4 address with no route costs nothing.
  #
  # The VPC is the account's default VPC and belongs to no stack, so its
  # IPv6 range was attached directly (see PrivateSubnet1Ipv6Cidr): CloudFormation cannot
  # report the range it assigns to a VPC it does not own, so the subnets could
  # not be carved from it here. The resources below only add to the VPC.
  # Removing them returns the API to IPv4-only, which needs endpoints back.

  PrivateSubnet1Ipv6:
    Type: AWS::EC2::SubnetCidrBlock
    Properties:
      SubnetId: !Ref PrivateSubnet1
      Ipv6CidrBlock: !Ref PrivateSubnet1Ipv6Cidr

  PrivateSubnet2Ipv6:
    Type: AWS::EC2::SubnetCidrBlock
    Properties:
      SubnetId: !Ref PrivateSubnet2
      Ipv6CidrBlock: !Ref PrivateSubnet2Ipv6Cidr

  EgressOnlyGateway:
    Type: AWS::EC2::EgressOnlyInternetGateway
    Properties:
      VpcId: !Ref VPC

  PrivateIpv6DefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableId
      DestinationIpv6CidrBlock: '::/0'
      EgressOnlyInternetGatewayId: !Ref EgressOnlyGateway

  # The only security group this stack creates. Outbound IPv6 for the API
  # function, nothing inbound; the shared Lambda group it sits beside admits
  # the database and allows outbound IPv4.
  ApiIpv6EgressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound IPv6 for the classyear-nest API function
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIpv6: '::/0'

  # ---------------------------------------------------------------------------
  # Bastion: a Session Manager port-forward to the database, for backups
  # ---------------------------------------------------------------------------
  #
  # The cluster is not publicly accessible, so `pg_dump` from a laptop needs a
  # host inside the VPC to forward through. scripts/backup-db.sh starts this
  # instance, forwards localhost to the cluster over Session Manager, dumps,
  # and stops it again — it spends its life stopped.
  #
  # No SSH: no key pair, and no inbound rule at all. Access is whatever the
  # caller's IAM identity allows for ssm:StartSession.
  #
  # It joins the existing Lambda security group rather than getting one of its
  # own, because the cluster's security group (owned by classyear-serverless)
  # admits 5432 only from that group, and admitting a new group would mean
  # editing the other stack's resources. The Lambda group has no inbound
  # rules, so membership grants reach and nothing else. It reaches Session
  # Manager over the internet: the SSM interface endpoint that once
  # intercepted ssm.* inside the VPC was removed on 2026-11-13.

  BastionRole:
    Type: AWS::IAM::Role
    Condition: BastionEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      # Session Manager only. It does not read the database secret: the
      # backup script does that with the caller's credentials, so the instance
      # never holds them.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: BastionEnabled
    Properties:
      Roles: [!Ref BastionRole]

  BastionLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: BastionEnabled
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 8
              Encrypted: true
              DeleteOnTermination: true

  BastionInstance:
    Type: AWS::EC2::Instance
    Condition: BastionEnabled
    Properties:
      ImageId: !Ref BastionImageId
      InstanceType: t4g.nano
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      IamInstanceProfile: !Ref BastionInstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref BastionLaunchTemplate
        Version: !GetAtt BastionLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub 'classyear-${Environment}-bastion'

  # ---------------------------------------------------------------------------
  # Frontend hosting: S3 + CloudFront + ACM + Route53
  # ---------------------------------------------------------------------------

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'classyear-nest-frontend-${AWS::AccountId}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      # Every name the distribution answers for, in one certificate. A
      # certificate's domain list is immutable, so changing this list
      # *replaces* the certificate: CloudFormation issues the new one,
      # validates it, repoints the distribution, and only then deletes the old.
      # That is how reunion-connect.org came off — one replacement, with the
      # public names served throughout.
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
        - !Ref StagingDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Ref StagingDomainName
          HostedZoneId: !Ref HostedZoneId

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'classyear-nest-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'ClassYear NestJS frontend (${Environment})'
        # A CloudFront alias belongs to exactly one distribution account-wide,
        # so the public names could not be claimed until the old stack
        # released them. That is what ClaimPublicNames gates: false leaves
        # this distribution on the staging name only, true takes the public
        # names — which it has since the cutover.
        Aliases: !If
          - PublicNamesClaimed
          - - !Ref DomainName
            - !Sub 'www.${DomainName}'
            - !Ref StagingDomainName
          - [!Ref StagingDomainName]
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
          Compress: true
        # SPA fallback: S3 answers 403/404 for client-side routes like /directory.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # The staging record, always present. Through phases 7–8 it was the only one,
  # which is what made this stack deployable with zero impact on either live
  # site; it now doubles as the name that keeps working during the
  # cutover, so there is somewhere to check the new app from while the public
  # names are in flight.
  #
  # Deliberately still called FrontendDNSRecords. Renaming it to something
  # clearer made the changeset read `Add StagingDNSRecord` + `Remove
  # FrontendDNSRecords` — two resources describing the *same* record. A
  # RecordSetGroup is created with a CREATE change batch, which fails when the
  # record already exists, so the add would have failed and rolled back the
  # whole deploy. Same logical id, same resolved values, no change at all.
  #
  # Its zone changed when the staging name moved to unicornconnections.org.
  # HostedZoneId is a replacement property, so CloudFormation creates the new
  # record before deleting the old — and the new name did not exist, so the
  # CREATE change batch has nothing to collide with.
  FrontendDNSRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref StagingDomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt FrontendDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's fixed zone ID

  # The public names. Created only once the old distribution has released
  # the aliases — pointing DNS at a distribution
  # that does not answer for the name yields an SSL error rather than a page.
  PrimaryDNSRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: PublicNamesClaimed
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt FrontendDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget:
            DNSName: !GetAtt FrontendDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  ApiEndpoint:
    Description: API Gateway base URL
    Value: !Sub 'https://${ClassYearNestAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  PulseUrl:
    Description: Health check, for smoke-deployed.sh and uptime checks
    Value: !Sub 'https://${ClassYearNestAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/pulse'
  FrontendUrl:
    Description: >-
      Where the app is actually reachable — the canonical domain, or the
      staging name under a ClaimPublicNames=false rollback. smoke-deployed.sh
      reads this, so it checks the name that is really serving rather than one
      that is merely intended.
    Value: !If
      - PublicNamesClaimed
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${StagingDomainName}'
  FrontendBucketName:
    Description: Upload the built SPA here
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: Invalidate after each frontend deploy
    Value: !Ref FrontendDistribution
  FileBucketName:
    Description: Owned by classyear-serverless — this stack does not own it
    Value: !Ref FileBucketName
  DatabaseEndpoint:
    Description: Owned by classyear-serverless — this stack does not own it
    Value: !Ref DatabaseHost
  BastionInstanceId:
    Condition: BastionEnabled
    Description: Session Manager target for scripts/backup-db.sh
    Value: !Ref BastionInstance
